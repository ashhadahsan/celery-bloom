name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: CELERY_BLOOM_SKIP_UI_BUILD=1 uv sync --extra dev

      - name: black
        run: uv run black --check celery_bloom/

      - name: mypy
        run: uv run mypy celery_bloom/

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build (frontend + wheel)
        run: uv build

      - name: Verify static assets bundled in wheel
        run: |
          python3 -c "
          import zipfile, glob, sys
          whl = glob.glob('dist/celery_bloom-*.whl')[0]
          files = zipfile.ZipFile(whl).namelist()
          has_index = any('static/index.html' in f for f in files)
          print('index.html in wheel:', has_index)
          sys.exit(0 if has_index else 1)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
