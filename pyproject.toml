[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "celery-bloom"
version = "0.1.0"
description = "A modern UI for monitoring Celery workers and tasks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["celery", "monitoring", "dashboard", "tasks", "workers"]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
celery-bloom = "celery_bloom.__main__:main"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["celery_bloom"]
artifacts = ["celery_bloom/static/**"]

[tool.hatch.build.targets.sdist]
include = ["celery_bloom/", "ui/", "hatch_build.py"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.12"
files = ["celery_bloom"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# Celery and some FastAPI patterns don't have complete stubs — keep strict off
strict = false
check_untyped_defs = true
